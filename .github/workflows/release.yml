name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      released: ${{ steps.version.outputs.changed }}
      release_tag: v${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2
      - name: Detect version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Read the current version from Gradle properties
          CURRENT_NAME=$(grep '^appVersionName=' android/gradle.properties | cut -d'=' -f2-)
          CURRENT_CODE=$(grep '^appVersionCode=' android/gradle.properties | cut -d'=' -f2-)

          VERSION_NAME="$CURRENT_NAME"
          VERSION_CODE="$CURRENT_CODE"

          # Compare the current version with the previous commit
          PREVIOUS_NAME=$(git show HEAD~1:android/gradle.properties 2>/dev/null \
            | grep '^appVersionName=' | cut -d'=' -f2- || true)

          SHOULD_RELEASE="true"

          # For tag pushes, release only when the version name has changed
          if [[ "$EVENT_NAME" == "push" ]] && [[ "$VERSION_NAME" == "$PREVIOUS_NAME" ]]; then
            SHOULD_RELEASE="false"
            echo "::notice::Version unchanged: $PREVIOUS_NAME -> $VERSION_NAME"
          fi

          if [[ "$SHOULD_RELEASE" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "build_version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
            echo "build_version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
            echo "::notice::Preparing release for version $VERSION_NAME"
          else
            # Generate a development version when no release is needed
            NEW_VERSION_CODE=$((VERSION_CODE + 1))

            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "build_version_name=$VERSION_NAME-dev.$NEW_VERSION_CODE" >> "$GITHUB_OUTPUT"
            echo "build_version_code=$NEW_VERSION_CODE" >> "$GITHUB_OUTPUT"
            echo "::notice::Development build: $VERSION_NAME-dev.$NEW_VERSION_CODE"
          fi

          # Export the original version information
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "previous_version=$PREVIOUS_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4.3.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.1.0
        with:
          gradle-version: wrapper
          cache-disabled: false

      - name: Build APK
        run: |
          bash android/gradlew -p android :app:assembleRelease \
            -PbuildTime="$(date -u '+%Y-%m-%d %H:%M')" \
            -PappVersionName="${{ steps.version.outputs.build_version_name }}" \
            -PappVersionCode="${{ steps.version.outputs.build_version_code }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: HyperIsland-v${{ steps.version.outputs.version_name }}
          path: build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Rename release APK
        if: steps.version.outputs.changed == 'true'
        run: |
          cp build/app/outputs/apk/release/app-release.apk \
            "HyperIsland-v${{ steps.version.outputs.version_name }}.apk"

      - name: Extract changelog
        if: steps.version.outputs.changed == 'true'
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version_name }}"
          $previousVersion = "${{ steps.version.outputs.previous_version }}"
          $changelogContent = ""

          # Prefer the matching section in CHANGELOG.md
          try {
            if (Test-Path 'docs/CHANGELOG.md') {
              $changelogFile = Get-Content 'docs/CHANGELOG.md' -Raw
              $escapedVersion = [regex]::Escape($version)

              $pattern = "(?ms)^#\s*V$escapedVersion\b[\s\S]*?(?=^#\s*V\d+\.\d+\.\d+\b|\Z)"
              $match = [regex]::Match($changelogFile, $pattern)

              # Try the dated heading format if the first pattern does not match
              if (-not $match.Success) {
                $pattern = "(?ms)^#\s*V$escapedVersion\s*\([\d-]+\)[\s\S]*?(?=^#\s*V\d+\.\d+\.\d+\s*\(|\Z)"
                $match = [regex]::Match($changelogFile, $pattern)
              }

              if ($match.Success) {
                $section = $match.Value.Trim()
                $lines = $section -split "`n"

                if ($lines.Length -gt 1) {
                  $body = ($lines | Select-Object -Skip 1) -join "`n"
                } else {
                  $body = $section
                }

                $body = $body.Trim()

                if ($body) {
                  Write-Output "Release notes extracted from CHANGELOG.md"
                  $changelogContent = $body
                }
              }
            }
          } catch {
            Write-Output "Failed to read CHANGELOG.md: $_"
          }

          # Fall back to Git commit history if no changelog entry exists
          if (-not $changelogContent) {
            Write-Output "No changelog entry found for version $version"
            $commitLog = ""

            if ($previousVersion -ne "") {
              try {
                $commits = git log "v$previousVersion"..HEAD --pretty=format:"- %s" 2>$null

                if ($commits) {
                  $commitLog = $commits
                }
              } catch {
                Write-Output "Unable to retrieve commits between versions"
              }
            }

            if (-not $commitLog) {
              $commitLog = git log --pretty=format:"- %s" -20 2>$null
            }

            $changelogContent = "### Changelog`n`n$commitLog"
          }

          # Write the multiline release notes to GitHub Actions output
          "content<<EOF" >> $env:GITHUB_OUTPUT
          $changelogContent >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: HyperIsland v${{ steps.version.outputs.version_name }}
          body: ${{ steps.changelog.outputs.content }}
          files: HyperIsland-v${{ steps.version.outputs.version_name }}.apk
          draft: false
          prerelease: false
