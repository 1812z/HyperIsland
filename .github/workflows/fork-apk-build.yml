name: Fork APK Build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed APK as a GitHub Release
        required: false
        type: boolean
        default: false
      release_tag:
        description: Release tag used when publish_release is enabled
        required: false
        type: string
        default: lbe-clipboard-toast-v1

permissions:
  contents: write

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@v4.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.1.0
        with:
          gradle-version: wrapper

      - name: Prepare fork signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/fork-release.jks
          fi

      - name: Build release-fast APK
        env:
          KEYSTORE_PATH: fork-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          bash android/gradlew -p android :app:assembleReleaseFast \
            -PbuildTime="$(date -u '+%Y-%m-%d %H:%M')"

      - name: Stage APK
        shell: bash
        run: |
          APK_PATH="$(find build/app/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/HyperIsland-lbe-clipboard-toast.apk
          sha256sum artifacts/HyperIsland-lbe-clipboard-toast.apk \
            > artifacts/HyperIsland-lbe-clipboard-toast.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: HyperIsland-lbe-clipboard-toast-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish signed fork release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: HyperIsland LBE Clipboard Toast v1
          body: |
            Custom HyperIsland build based on upstream main.

            Adds HyperOS clipboard-read prompt interception for
            `com.lbe.security.utility.ToastUtil.initToastView(String, int)` when `type == 1`,
            forwards it through HyperIsland's existing Toast/IslandDispatcher path, and
            suppresses the original touch-blocking LBE view.

            Enable **Settings → Hook Extensions → Xiaomi clipboard prompt island** and
            restart both System UI and Permission Manager scopes.
          files: |
            artifacts/HyperIsland-lbe-clipboard-toast.apk
            artifacts/HyperIsland-lbe-clipboard-toast.apk.sha256
          draft: false
          prerelease: true
